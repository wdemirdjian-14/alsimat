# /etc/nginx/sites-available/alsimat.conf
# Activer : ln -s /etc/nginx/sites-available/alsimat.conf /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS : certbot --nginx -d alsimat.com -d www.alsimat.com   (certbot ajoute lui-même les blocs 443)

upstream alsimat_app {
    server 127.0.0.1:3010;   # = APP_PORT du fichier .env
    keepalive 16;
}

# www -> domaine nu (une seule version du site pour Google)
server {
    listen 80;
    listen [::]:80;
    server_name www.alsimat.com;
    return 301 https://alsimat.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name alsimat.com;

    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Images envoyées depuis l'admin : servies directement par Nginx
    location /uploads/ {
        alias /opt/alsimat/uploads/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /_next/static/ {
        proxy_pass http://alsimat_app;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://alsimat_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
